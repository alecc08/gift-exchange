<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Snowflake for email headers. Same six-arm geometry as the site's #i-flake,
       colors fixed (email clients have no currentColor): gold on transparent,
       readable on the pine header band. -->
  <g fill="none" stroke="#d4af62" stroke-width="2.6" stroke-linecap="round">
    <g><path d="M50 50 L50 6"/><path d="M50 20 L60 8.9"/><path d="M50 20 L40 8.9"/><path d="M50 31 L57.1 22.6"/><path d="M50 31 L42.9 22.6"/><path d="M41.7 13.9 L50 6 L58.3 13.9"/></g>
    <g transform="rotate(60 50 50)"><path d="M50 50 L50 6"/><path d="M50 20 L60 8.9"/><path d="M50 20 L40 8.9"/><path d="M50 31 L57.1 22.6"/><path d="M50 31 L42.9 22.6"/><path d="M41.7 13.9 L50 6 L58.3 13.9"/></g>
    <g transform="rotate(120 50 50)"><path d="M50 50 L50 6"/><path d="M50 20 L60 8.9"/><path d="M50 20 L40 8.9"/><path d="M50 31 L57.1 22.6"/><path d="M50 31 L42.9 22.6"/><path d="M41.7 13.9 L50 6 L58.3 13.9"/></g>
    <g transform="rotate(180 50 50)"><path d="M50 50 L50 6"/><path d="M50 20 L60 8.9"/><path d="M50 20 L40 8.9"/><path d="M50 31 L57.1 22.6"/><path d="M50 31 L42.9 22.6"/><path d="M41.7 13.9 L50 6 L58.3 13.9"/></g>
    <g transform="rotate(240 50 50)"><path d="M50 50 L50 6"/><path d="M50 20 L60 8.9"/><path d="M50 20 L40 8.9"/><path d="M50 31 L57.1 22.6"/><path d="M50 31 L42.9 22.6"/><path d="M41.7 13.9 L50 6 L58.3 13.9"/></g>
    <g transform="rotate(300 50 50)"><path d="M50 50 L50 6"/><path d="M50 20 L60 8.9"/><path d="M50 20 L40 8.9"/><path d="M50 31 L57.1 22.6"/><path d="M50 31 L42.9 22.6"/><path d="M41.7 13.9 L50 6 L58.3 13.9"/></g>
  </g>
  <g fill="none" stroke="#e6c98a" stroke-width="1.4" stroke-linecap="round" opacity=".85">
    <circle cx="50" cy="50" r="27"/>
  </g>
  <circle cx="50" cy="50" r="3.4" fill="#e6c98a"/>
  <circle cx="50" cy="17" r="1.8" fill="#ffffff" opacity=".9"/>
  <circle cx="78.6" cy="66.5" r="1.8" fill="#ffffff" opacity=".9"/>
  <circle cx="21.4" cy="66.5" r="1.8" fill="#ffffff" opacity=".9"/>
</svg>

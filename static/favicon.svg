<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Échange de cadeaux">
  <!-- Browser tab / bookmark icon. Same crystalline flake as tools/app-icon.html, kept as a
       separate hand-written file so the tab icon stays a few hundred bytes instead of a PNG. -->
  <defs>
    <linearGradient id="pine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1f18"/><stop offset=".5" stop-color="#0e2b21"/><stop offset="1" stop-color="#1f5340"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#c79a3b" stop-opacity=".26"/><stop offset="1" stop-color="#c79a3b" stop-opacity="0"/>
    </radialGradient>
    <g id="arm" fill="none" stroke="#e6c98a" stroke-width="13" stroke-linecap="round">
      <path d="M256 256V78"/><path d="M256 118l-46-40"/><path d="M256 118l46-40"/>
      <path d="M256 176l-62-52"/><path d="M256 176l62-52"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#pine)"/>
  <rect width="512" height="512" rx="104" fill="url(#glow)"/>
  <g>
    <use href="#arm"/><use href="#arm" transform="rotate(60 256 256)"/><use href="#arm" transform="rotate(120 256 256)"/>
    <use href="#arm" transform="rotate(180 256 256)"/><use href="#arm" transform="rotate(240 256 256)"/><use href="#arm" transform="rotate(300 256 256)"/>
    <circle cx="256" cy="256" r="20" fill="#e6c98a"/>
  </g>
  <circle cx="256" cy="256" r="7" fill="#c0392f"/>
</svg>

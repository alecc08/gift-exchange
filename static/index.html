/* ------------------------------- app ------------------------------- */
const DEFAULT_LIMITS = { name: 80, family_group: 60, group_key: 60, wishlist: 1000, email: 320, event_title: 120, budget_note: 500, max_quota: 10, default_password: false };

/* SQLite hands back 0/1 for the checkbox preferences and the checkboxes want real booleans.
   Coerced on the way in, for both the live copy and the saved copy, otherwise rulesDirty
   compares true to 1 and the panel reads "unsaved changes" forever. */
function asAdminConfig(config) {
  return {
    ...config,
    avoid_same_group: !!config.avoid_same_group,
    auto_email_on_draw: !!config.auto_email_on_draw,
  };
}

function giftExchange() {
  return {
    lang: localStorage.getItem('ge_lang') || 'fr',
    /* Which screen this document is. The server stamps it (see spa_shell/route_tag in main.py):
       the console is served at its own path, and every other path is the family's page. Absent
       (opened from a file, a stale cache) counts as the family's page — never as the console. */
    route: { organizer: window.__GE_ORGANIZER__ === true },
    mode: 'landing',
    token: null,
    limits: { ...DEFAULT_LIMITS },

    authed: false, busy: false, loginError: '', pwDraft: '',
    adminError: '', adminErrorTitle: '', securityNotice: '',
    /* Draws (one server, several events). `activeDraw` is the console's subject: null means the
       list screen is showing. It lives in the URL (?draw=7) so a reload or a shared bookmark
       lands on the same event instead of dumping the organizer back on the list. */
    draws: [], activeDraw: null, drawDraft: { event_title: '', budget_note: '', copy_from: '' },
    cfg: { event_title: '', budget_note: '', adult_draws_adult: 1, adult_draws_child: 2, child_draws_adult: 0, child_draws_child: 0, avoid_same_group: true, email_language: 'fr', auto_email_on_draw: false },
    savedCfg: null,
    participants: [], locked: false, groupFilter: '',
    draft: { name: '', role: 'ADULT', family_group: '', group_key: '', wishlist: '', email: '' },
    copiedId: null, copiedAll: false,
    /* The setTimeout handles for the "copied" flags, declared so they can be cancelled. */
    _timers: {},
    emailEnabled: false, emailBusyId: null, sendingAll: false, previewOpen: false, previewBody: null,

    participant: null, data: { status: '', assignments: [] }, pError: false,
    revealed: false, burstOn: false, wishlistDraft: '', savedWishlist: '', savedAt: null,
    copiedList: false, poll: null,
    burst: [],

    /* ---------- helpers ---------- */
    t(key, vars) {
      const table = I18N[this.lang] || I18N.fr;
      let text = table[key] ?? I18N.fr[key] ?? key;
      if (vars) for (const [k, v] of Object.entries(vars)) text = text.split('{' + k + '}').join(v);
      return text;
    },
    get pageTitle() {
      if (this.mode === 'participant') return this.data.event_title || this.t('brand');
      if (this.mode === 'landing') return this.t('landing.kicker');
      // The list screen is not about one draw, so it must not borrow a title from the last one
      // the organizer had open.
      if (this.activeDraw === null) return this.t('draws.title');
      return this.cfg.event_title || this.t('admin.title');
    },
    get adults() { return this.participants.filter(p => p.role === 'ADULT'); },
    get children() { return this.participants.filter(p => p.role === 'CHILD'); },
    get rosterSummary() {
      return this.t('roster.summary', { n: this.participants.length, a: this.adults.length, c: this.children.length });
    },
    get totals() {
      const cfg = this.cfg, a = this.adults.length, c = this.children.length;
      const toAdults = a * (cfg.adult_draws_adult || 0) + c * (cfg.child_draws_adult || 0);
      const toChildren = a * (cfg.adult_draws_child || 0) + c * (cfg.child_draws_child || 0);
      return { toAdults, toChildren, gifts: toAdults + toChildren };
    },
    get giftForecast() {
      return this.t('draw.forecast', { gifts: this.totals.gifts, toAdults: this.totals.toAdults, toChildren: this.totals.toChildren });
    },
    /* Two different labels on purpose: `family_group` is a surname people share, `group_key` is the
       household the rule actually works on. Chips and filters use the household. */
    /* Household chips and surname chips are the same tally over a different field: display name,
       case-insensitive count, biggest first then alphabetical. An empty value is nobody's household
       and nobody's surname, so it never becomes a chip. */
    tallyBy(field) {
      const counts = new Map();
      for (const person of this.participants) {
        const key = (person[field] || '').trim().toLowerCase();
        if (!key) continue;
        const found = counts.get(key);
        if (found) found.count += 1;
        else counts.set(key, { name: person[field], count: 1 });
      }
      return [...counts.values()].sort((x, y) => y.count - x.count || x.name.localeCompare(y.name));
    },
    get householdGroups() { return this.tallyBy('group_key'); },
    get familyNames() { return this.tallyBy('family_group'); },
    get visibleParticipants() {
      if (!this.groupFilter) return this.participants;
      const wanted = this.groupFilter.trim().toLowerCase();
      return this.participants.filter(p => p.group_key.trim().toLowerCase() === wanted);
    },
    get openedCount() { return this.participants.filter(p => p.viewed_at).length; },
    /* Delivery counters for the bulk button chip. emailReadyCount counts addresses that would
       actually pass the server's send-time check — the "12/12" you want before clicking. */
    get mailedCount() { return this.participants.filter(p => p.email_sent_at).length; },
    get emailReadyCount() { return this.participants.filter(p => this.looksLikeEmail(p.email)).length; },
    /* Distinct mailboxes among the people with an address: the number of emails that will actually
       leave. Twelve cousins at five addresses is five sends, and saying so here is what makes the
       "Envoyer" click predictable instead of a guess. */
    get mailboxCount() {
      return new Set(this.participants
        .filter(p => this.looksLikeEmail(p.email))
        .map(p => this.addressKey(p))).size;
    },
    looksLikeEmail(value) {
      // Mirrors the server's EMAIL_RE intent: something @ something.tld, no spaces. Deliberately
      // only used for the soft warning — the server, not this regex, is the authority.
      return typeof value === 'string' && /^[^@\s]{1,120}@[^\s@]+\.[^\s@]{2,}$/.test(value);
    },
    get rulesDirty() {
      return this.savedCfg && JSON.stringify(this.savedCfg) !== JSON.stringify(this.cfg);
    },
    /* How many gifts crossed a group in the draw that is currently locked. A count only: the
       organizer is told the draw had to relax, never which pair did. */
    get sameGroupCrossings() { return this.cfg.same_group_crossings || 0; },
    /* Client-side mirror of the engine's **hard** rules only: the quota arithmetic is the one thing
       that can stop a draw, so this is what disables the button. Group tightness is a preference the
       solver relaxes on its own, so it goes in groupNotes() as information. */
    get warnings() {
      const out = [];
      if (this.participants.length === 0 || this.locked) return out;
      if (this.participants.length === 1) return [this.t('warn.selfOnly')];
      const cfg = this.cfg;
      const check = (sample, need, pool, key) => {
        if (need <= 0) return;
        if (pool.length === 0) { out.push(this.t('warn.noReceivers', { role: this.t('role.' + sample.role) })); return; }
        // Nobody can receive their own gift, so a giver in this pool has one fewer option.
        const available = Math.min(...pool.map(q => pool.length - (q.role === sample.role ? 1 : 0)));
        if (need > available) out.push(this.t(key, { need, available }));
      };
      if (this.adults.length) {
        check(this.adults[0], cfg.adult_draws_adult, this.adults, 'warn.adultsNeed');
        check(this.adults[0], cfg.adult_draws_child, this.children, 'warn.childrenNeed');
      }
      if (this.children.length) {
        check(this.children[0], cfg.child_draws_adult, this.adults, 'warn.childAdultsNeed');
        check(this.children[0], cfg.child_draws_child, this.children, 'warn.childChildrenNeed');
      }
      return [...new Set(out)];
    },
    /* Not errors: what the solver is going to have to bend. This is `_min_crossings()` from main.py
       ported line by line — same blank-group handling, same lower bound — so the number shown here is
       the number the draw will actually need to spend. */
    get groupNotes() {
      // The "rule is off" note is about the configuration, not the roster: it stands before *and*
      // after the draw, because it explains why nothing is being reported about groups.
      if (!this.cfg.avoid_same_group) return [this.t('note.groupsIgnored')];
      if (this.locked || this.participants.length === 0) return [];
      const cfg = this.cfg;
      const quota = {
        ADULT: [Number(cfg.adult_draws_adult) || 0, Number(cfg.adult_draws_child) || 0],
        CHILD: [Number(cfg.child_draws_adult) || 0, Number(cfg.child_draws_child) || 0],
      };
      // A blank group is "in no group": everyone in that case gets a private key, exactly like the
      // engine's `#solo:<id>`, so two people with nothing filled in are not one household.
      const key = (p) => p.group_key.trim().toLowerCase() || '#solo:' + p.id;
      let forced = 0;
      const pools = [[this.adults, 0, this.totals.toAdults], [this.children, 1, this.totals.toChildren]];
      for (const [members, index, slotsTotal] of pools) {
        if (slotsTotal <= 0 || members.length === 0) continue;
        const base = Math.floor(slotsTotal / members.length);
        const sizes = new Map();
        for (const member of members) sizes.set(key(member), (sizes.get(key(member)) || 0) + 1);
        const demand = new Map();
        let demandTotal = 0;
        for (const giver of this.participants) {
          const want = quota[giver.role][index];
          if (!want) continue;
          demand.set(key(giver), (demand.get(key(giver)) || 0) + want);
          demandTotal += want;
        }
        for (const [group, size] of sizes) {
          const insideSlots = base * size;
          const wantInside = demand.get(group) || 0;
          forced += Math.max(wantInside - (slotsTotal - insideSlots),
                             insideSlots - (demandTotal - wantInside), 0);
        }
      }
      if (forced > 0) return [this.t('note.crossingsNeeded', { n: forced })];
      if (this.householdGroups.length === 0) return [this.t('note.noGroups')];
      return [];
    },
    drawsOf(p) {
      const cfg = this.cfg;
      return p.role === 'ADULT'
        ? (cfg.adult_draws_adult || 0) + (cfg.adult_draws_child || 0)
        : (cfg.child_draws_adult || 0) + (cfg.child_draws_child || 0);
    },
    get draftReady() { return !!(this.draft.name && this.draft.family_group); },
    get wishlistDirty() { return this.wishlistDraft !== this.savedWishlist; },
    /* Quebec French for dates/relative times ("il y a 5 minutes", 24 h clock);
       Canadian English for the EN switch. */
    locale() { return this.lang === 'fr' ? 'fr-CA' : 'en-CA'; },
    /* A stored ISO timestamp, or null when the string is unusable — both formatters print the raw
       value in that case, because an invented date is worse than an ugly one. */
    parseDate(value) {
      if (!value) return null;
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    },
    formatDate(value) {
      const date = this.parseDate(value);
      if (!date) return value || '';
      return new Intl.DateTimeFormat(this.locale(), { dateStyle: 'medium', timeStyle: 'short' }).format(date);
    },
    relative(value) {
      const date = this.parseDate(value);
      if (!date) return value || '';
      const seconds = Math.round((Date.now() - date.getTime()) / 1000);
      const rtf = new Intl.RelativeTimeFormat(this.locale(), { numeric: 'auto' });
      if (Math.abs(seconds) < 60) return rtf.format(-seconds, 'second');
      if (Math.abs(seconds) < 3600) return rtf.format(-Math.round(seconds / 60), 'minute');
      if (Math.abs(seconds) < 86400) return rtf.format(-Math.round(seconds / 3600), 'hour');
      return rtf.format(-Math.round(seconds / 86400), 'day');
    },

    /* ---------- boot ---------- */
    async boot() {
      document.documentElement.lang = this.locale();
      this.burst = Array.from({ length: 14 }, (_unused, i) => {
        const angle = (i / 14) * Math.PI * 2 + Math.random() * 0.4;
        const distance = 90 + Math.random() * 90;
        return {
          dx: Math.round(Math.cos(angle) * distance),
          dy: Math.round(Math.sin(angle) * distance - 30),
          rot: Math.round(Math.random() * 260 - 130),
          size: 12 + Math.round(Math.random() * 16),
          delay: Math.round(Math.random() * 260),
        };
      });
      this.makeSnow();
      await this.loadLimits();

      const params = new URLSearchParams(window.location.search);
      this.token = params.get('t');
      if (this.token) {
        // A token is a query parameter, so a private link works from any path this shell is
        // served at; it always wins over the console.
        this.mode = 'participant';
        this.revealed = sessionStorage.getItem('ge_revealed_' + this.token) === '1';
        await this.loadDraw();
      } else if (this.route.organizer) {
        this.mode = 'admin';
        if (sessionStorage.getItem('ge_admin_token')) {
          this.authed = true;
          await this.enterAdmin();
        }
      }
      // The <title> the server sends is the generic share card, which is the right thing before this
      // script knows anything and the wrong thing afterwards: on the family's landing card an English
      // reader should not be left holding a French tab. The other two screens name the tab after the
      // event once the event is loaded; this one has no event, so it takes the localized brand.
      if (this.mode === 'landing') document.title = this.t('brand');
    },

    /* Where an organizer lands: the draw in the URL if it still exists, otherwise the list. A
       bookmarked console link is worth keeping across a reload, but a deleted draw must not leave
       the screen pointing at nothing. The query string is read here so both callers — boot and a
       fresh login — get the same answer. */
    async enterAdmin() {
      await this.loadDraws();
      const wanted = parseInt(new URLSearchParams(window.location.search).get('draw'), 10);
      if (Number.isInteger(wanted) && this.draws.some(entry => entry.id === wanted)) {
        await this.openDraw(wanted);
      }
    },

    setLang(lang) {
      this.lang = lang;
      localStorage.setItem('ge_lang', lang);
      document.documentElement.lang = this.locale();
      if (this.mode === 'landing') document.title = this.t('brand');
    },

    async loadLimits() {
      try {
        const response = await fetch('/api/limits');
        if (!response.ok) return;
        this.limits = { ...DEFAULT_LIMITS, ...(await response.json()) };
        if (this.limits.default_password) this.securityNotice = this.t('notice.defaultPassword');
      } catch (_err) { /* offline: keep defaults */ }
    },

    /* ---------- toasts ---------- */
    toast(message, kind = 'info') {
      const host = document.getElementById('toasts');
      if (!host) return;
      const node = document.createElement('div');
      const palette = kind === 'error'
        ? 'bg-holly-100 ring-holly-500/30 text-holly-700'
        : kind === 'warn' ? 'bg-gold-100 ring-gold-500/30 text-gold-600' : 'bg-white ring-black/5 text-pine-700';
      node.className = `pop-in flex items-start gap-2 max-w-sm rounded-2xl px-4 py-3 text-sm shadow-lift ring-1 ${palette}`;
      node.textContent = message;
      host.appendChild(node);
      setTimeout(() => {
        node.style.transition = 'opacity .3s ease, transform .3s ease';
        node.style.opacity = '0';
        node.style.transform = 'translateY(6px)';
        setTimeout(() => node.remove(), 320);
      }, kind === 'error' ? 6500 : 3800);
    },

    /* ---------- transport ---------- */
    authHeaders() {
      const headers = {};
      // Only the bearer token: the console never stores the password itself, and a bare
      // X-Admin-Password header is for curl and scripts, not for the browser.
      const bearer = sessionStorage.getItem('ge_admin_token');
      if (bearer) headers['Authorization'] = 'Bearer ' + bearer;
      return headers;
    },
    async api(path, options = {}, withAuth = false) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (withAuth) Object.assign(headers, this.authHeaders());
      const response = await fetch(path, { ...options, headers });
      if (withAuth && response.status === 401) {
        sessionStorage.removeItem('ge_admin_token');
        this.authed = false;
        this.toast(this.t('login.expired'), 'warn');
      }
      let body = null;
      try { body = await response.json(); } catch (_err) { /* empty body */ }
      return { ok: response.ok, status: response.status, body, headers: response.headers };
    },
    errorText(response, fallbackKey) {
      const detail = typeof response?.body?.detail === 'string' ? response.body.detail : '';
      if (response.status === 401) return this.t(fallbackKey || 'err.unknown');   // "Unauthorized" is not user-facing
      if (response.status === 429) {
        const seconds = parseInt(response.headers?.get?.('retry-after') || '30', 10);
        return this.t('err.rateLimited', { s: Number.isFinite(seconds) ? seconds : 30 });
      }
      if (response.status === 413) return this.t('err.tooLarge');
      // The two email 503s first: the generic one below would otherwise mask them and tell the
      // organizer about the admin password when the problem is the mail setup.
      // 'not configured on this server' is the email feature's own 503; the admin-password 503 says
      // 'not configured on the server' — distinct on purpose so the two never mask each other.
      if (detail.includes('not configured on this server')) return this.t('err.notConfigured');
      // The 503 for "I do not know my own public address" has to be distinguishable from the
      // not-configured one: the fix is a different variable, and the organizer is the one who sets it.
      if (detail.includes('public address')) return this.t('err.badBaseUrl');
      if (response.status === 503) return this.t('err.unconfiguredAdmin');
      if (detail.includes('cannot be satisfied')) return this.t('err.unsolvable');
      if (detail.includes('empty target group')) return this.t('err.emptyTarget');
      if (detail.includes('no email address')) return this.t('err.noAddress');
      if (detail.includes('refused the send')) return this.t('err.sendFailed');
      if (detail.includes('locked')) return this.t('err.locked');
      if (detail.includes('no participants')) return this.t('err.noParticipants');
      // Multi-draw: a stale bookmark or a deleted draw. Both mean "this screen is pointing at
      // nothing", and the fix is the same — go back to the list and pick one.
      if (detail.includes('draw does not exist')) return this.t('err.drawGone');
      if (detail.includes('No draw selected') || detail.includes('no draw yet')) return this.t('err.pickDraw');
      return detail || this.t(fallbackKey || 'err.unknown');
    },
    showAdminError(response, fallbackKey) {
      this.adminErrorTitle = response.status === 429
        ? this.t('err.rateLimitedTitle') : this.t('err.title');
      this.adminError = this.errorText(response, fallbackKey);
    },
    clearAdminError() { this.adminError = ''; this.adminErrorTitle = ''; },

    /* ---------- draws (the list screen) ---------- */
    drawPath(path) {
      /* Every admin call except the draw list and the login pair is about one draw. The server
         refuses to guess once a second draw exists, so the id travels on every request. */
      if (this.activeDraw === null) return path;
      return path + (path.includes('?') ? '&' : '?') + 'draw_id=' + encodeURIComponent(this.activeDraw);
    },

    async loadDraws() {
      const response = await this.api('/api/admin/draws', { method: 'GET' }, true);
      if (!response.ok) { this.showAdminError(response); return; }
      this.draws = response.body.draws || [];
      this.emailEnabled = !!response.body.email_enabled;
    },

    /* The console's own address, in one place. It used to be the site root, so every rewrite said
       '/' — which, now that the console is served at its own path, would have bounced the organizer
       onto the family's landing card mid-session. */
    consoleUrl(drawId = null) {
      const path = window.location.pathname;
      return drawId === null ? path : `${path}?draw=${encodeURIComponent(drawId)}`;
    },
    async openDraw(id) {
      this.activeDraw = id;
      this.clearAdminError();
      window.history.replaceState({}, '', this.consoleUrl(id));
      await this.loadState();
    },

    backToDraws() {
      this.activeDraw = null;
      this.previewOpen = false;
      this.groupFilter = '';
      window.history.replaceState({}, '', this.consoleUrl());
      // The tab stops naming one event as soon as the organizer is back among several.
      document.title = this.t('brand');
      this.loadDraws();
    },

    async createDraw() {
      if (!this.drawDraft.event_title.trim()) return;
      this.busy = true;
      this.clearAdminError();
      const body = { event_title: this.drawDraft.event_title, budget_note: this.drawDraft.budget_note };
      if (this.drawDraft.copy_from) body.copy_participants_from = Number(this.drawDraft.copy_from);
      const response = await this.api('/api/admin/draws', { method: 'POST', body: JSON.stringify(body) }, true);
      this.busy = false;
      if (!response.ok) { this.showAdminError(response); return; }
      this.drawDraft = { event_title: '', budget_note: '', copy_from: '' };
      this.toast(this.t('draws.created', { title: response.body.draw.event_title }));
      await this.openDraw(response.body.draw.id);
    },

    async deleteDraw(entry) {
      if (!window.confirm(this.t('draws.confirmDelete', { title: entry.event_title, n: entry.participants }))) return;
      this.busy = true;
      const response = await this.api(`/api/admin/draws/${entry.id}`, { method: 'DELETE' }, true);
      this.busy = false;
      if (!response.ok) { this.showAdminError(response); return; }
      this.toast(this.t('draws.deleted', { title: entry.event_title }));
      await this.loadDraws();
    },

    /* One status line per draw, in the words the console already uses for locked/open. A draw
       locked before this version has no drawn_at, so it says "verrouillé" without inventing a date. */
    drawStatus(entry) {
      if (!entry.is_locked) return this.t('draws.status_open');
      return entry.drawn_at ? this.t('draws.status_drawn', { at: this.formatDate(entry.drawn_at) })
                            : this.t('draws.status_locked');
    },
    drawCounts(entry) {
      return this.t('draws.counts', { people: entry.participants, mailed: entry.mailed, opened: entry.opened });
    },

    /* ---------- admin ---------- */
    async login() {
      this.busy = true;
      this.loginError = '';
      const response = await this.api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: this.pwDraft }) });
      this.busy = false;
      if (!response.ok) {
        this.loginError = this.errorText(response, 'login.error');
        return;
      }
      sessionStorage.setItem('ge_admin_token', response.body.token);
      this.pwDraft = '';
      this.authed = true;
      await this.enterAdmin();
    },
    async lock() {
      await this.api('/api/admin/logout', { method: 'POST', body: '{}' }, true);
      sessionStorage.removeItem('ge_admin_token');
      this.authed = false;
      this.participants = [];
      this.draws = [];
      this.activeDraw = null;
      this.clearAdminError();
      this.securityNotice = '';
      // Back to the console's own path, not to "/": signing out must not drop the organizer onto
      // the family's landing card, which is where the console used to be.
      window.history.replaceState({}, '', window.location.pathname);
    },
    async loadState() {
      const response = await this.api(this.drawPath('/api/admin/state'), { method: 'GET' }, true);
      if (!response.ok) return;
      this.cfg = asAdminConfig(response.body.config);
      this.savedCfg = { ...this.cfg };
      this.participants = response.body.participants;
      this.emailEnabled = !!response.body.email_enabled;
      this.locked = !!response.body.config.is_locked;
      if (response.body.config.event_title) document.title = response.body.config.event_title;
    },
    async saveConfig() {
      this.busy = true;
      this.clearAdminError();
      const numeric = ['adult_draws_adult', 'adult_draws_child', 'child_draws_adult', 'child_draws_child'];
      const body = { event_title: this.cfg.event_title, budget_note: this.cfg.budget_note };
      for (const key of numeric) body[key] = Math.max(0, Math.min(this.limits.max_quota, Number(this.cfg[key]) || 0));
      body.avoid_same_group = !!this.cfg.avoid_same_group;
      body.email_language = this.cfg.email_language === 'en' ? 'en' : 'fr';
      body.auto_email_on_draw = !!this.cfg.auto_email_on_draw;
      const response = await this.api(this.drawPath('/api/admin/config'), { method: 'PUT', body: JSON.stringify(body) }, true);
      this.busy = false;
      if (response.ok) this.toast(this.t('rules.saved'));
      else this.showAdminError(response);
      await this.loadState();
    },
    async addParticipant() {
      if (!this.draftReady) return;
      this.busy = true;
      this.clearAdminError();
      const response = await this.api(this.drawPath('/api/admin/participants'), { method: 'POST', body: JSON.stringify(this.draft) }, true);
      this.busy = false;
      if (!response.ok) { this.showAdminError(response); return; }
      this.draft = { name: '', role: this.draft.role, family_group: this.draft.family_group,
                     group_key: this.draft.group_key, wishlist: '', email: '' };
      await this.loadState();
      const field = document.getElementById('p-name');
      if (field) field.focus();
    },
    async removeParticipant(person) {
      if (!window.confirm(this.t('roster.confirmDelete', { name: person.name }))) return;
      this.busy = true;
      const response = await this.api(this.drawPath(`/api/admin/participants/${person.id}`), { method: 'DELETE' }, true);
      this.busy = false;
      if (!response.ok) this.showAdminError(response);
      else await this.loadState();
    },
    async writeClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_err) { /* fall through to the textarea trick */ }
      const helper = document.createElement('textarea');
      helper.value = text;
      helper.setAttribute('readonly', '');
      helper.style.position = 'fixed';
      helper.style.opacity = '0';
      document.body.appendChild(helper);
      helper.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch (_err) { copied = false; }
      helper.remove();
      return copied;
    },
    /* The participant's URL, built in one place because three things have to agree on it: this
       console, the mail template (`participant_link()` in main.py) and whatever the family was
       already mailed. One shape, `/?t=<uuid>`, and the token is a credential. */
    participantUrl(person) {
      return `${window.location.origin}/?t=${person.token}`;
    },
    /* A "copied" flag that turns itself back off. Three controls need it, and the third copy of
       the clearTimeout/setTimeout pair is how a timer leaks into a button the user already left. */
    flashFlag(flag, onValue, offValue, ms) {
      clearTimeout(this._timers[flag]);
      this[flag] = onValue;
      this._timers[flag] = setTimeout(() => { this[flag] = offValue; }, ms);
    },
    async copyLink(person) {
      const url = this.participantUrl(person);
      if (!(await this.writeClipboard(url))) { window.prompt(this.t('err.copy'), url); return; }
      this.flashFlag('copiedId', person.id, null, 1800);
    },
    async copyAllLinks() {
      const lines = this.participants
        .map(p => `${p.name} (${this.t('role.' + p.role)}, ${p.family_group}`
          + `${p.group_key ? ' · ' + this.t('roster.group') + ' ' + p.group_key : ''}`
          + `) — ${this.participantUrl(p)}`)
        .join('\n');
      if (!(await this.writeClipboard(lines))) { window.prompt(this.t('err.copy'), lines); return; }
      this.flashFlag('copiedAll', true, false, 2200);
      this.toast(this.t('roster.copied'));
    },

    /* ---------- email ---------- */
    async saveEmail(person) {
      // Fires on change (blur/Enter), not per keystroke: free text in, normalized by the server.
      this.clearAdminError();
      const response = await this.api(this.drawPath(`/api/admin/participants/${person.id}`),
        { method: 'PUT', body: JSON.stringify({ email: person.email || '' }) }, true);
      if (!response.ok) this.showAdminError(response);
      else this.toast(this.t('roster.email_saved', { name: person.name }));
      await this.loadState();
    },
    async sendEmail(person) {
      this.emailBusyId = person.id;
      this.clearAdminError();
      const response = await this.api(this.drawPath(`/api/admin/participants/${person.id}/email`),
        { method: 'POST', body: '{}' }, true);
      this.emailBusyId = null;
      if (!response.ok) { this.showAdminError(response); await this.loadState(); return; }
      // The server sends the mailbox, not the row: say what left, or an organizer who sees one
      // toast for three relatives thinks two of them were forgotten.
      const others = (response.body.with || []).length;
      this.toast(others ? this.t('roster.sent_with', { name: person.name, n: others })
                        : this.t('roster.sent', { name: person.name }));
      await this.loadState();
    },
    async sendAllEmails() {
      if (!window.confirm(this.t('roster.send_all_help'))) return;
      this.sendingAll = true;
      this.clearAdminError();
      const response = await this.api(this.drawPath('/api/admin/emails'), { method: 'POST', body: '{}' }, true);
      this.sendingAll = false;
      if (!response.ok) { this.showAdminError(response); return; }
      this.toast(this.t('roster.bulk_done', { sent: response.body.sent,
                                              messages: response.body.messages }));
      const failed = (response.body.results || []).filter(r => !r.ok).map(r => r.name);
      if (failed.length) this.toast(this.t('roster.bulk_failed', { names: failed.join(', ') }), 'warn');
      await this.loadState();
    },
    /* The same grouping the server applies when it bundles a household into one mail
       (`_group_by_address` in main.py): compare the trimmed, lowercased address. */
    addressKey(person) {
      return (person.email || '').trim().toLowerCase();
    },
    /* Who else shares this person's address, in this draw. That is the household the one-mail rule
       sends to, and the console should say so before the click, not after the surprise. */
    emailHousehold(person) {
      const address = this.addressKey(person);
      if (!address) return [];
      return this.participants.filter(other => this.addressKey(other) === address);
    },
    sendHelpFor(person) {
      const shared = this.emailHousehold(person).length;
      return shared > 1 ? this.t('roster.sendSharedHelp', { n: shared }) : this.t('roster.sendHelp');
    },
    async previewEmail(links = 1) {
      this.clearAdminError();
      const response = await this.api(this.drawPath('/api/admin/emails/preview'), {
        method: 'POST',
        body: JSON.stringify({ language: this.cfg.email_language,
                               state: this.locked ? 'ready' : 'pending',
                               links: links }),
      }, true);
      if (!response.ok) { this.showAdminError(response); return; }
      this.previewBody = response.body;
      this.previewOpen = true;
    },

    async runDraw() {      if (this.warnings.length) return;
      if (!window.confirm(this.t('draw.confirmGenerate', { gifts: this.totals.gifts }))) return;
      this.busy = true;
      this.clearAdminError();
      const response = await this.api(this.drawPath('/api/admin/draw'), { method: 'POST', body: '{}' }, true);
      this.busy = false;
      if (!response.ok) {
        this.showAdminError(response);
        if (response.status === 409) this.toast(this.t('draw.alreadyLocked'), 'warn');
        await this.loadState();
        return;
      }
      this.toast(this.t('draw.done'));
      if (response.body?.same_group_crossings > 0) {
        this.toast(this.t('draw.crossings', { n: response.body.same_group_crossings }), 'warn');
      }
      /* The draw locks first and mails after, so these toasts describe mail that really went out. */
      if (response.body?.emails) {
        this.toast(this.t('draw.auto_email_done', { sent: response.body.emails.sent }));
        const failed = (response.body.emails.results || []).filter(r => !r.ok).map(r => r.name);
        if (failed.length) this.toast(this.t('draw.auto_email_failed', { names: failed.join(', ') }), 'warn');
      }
      await this.loadState();
    },
    async resetDraw() {
      if (!window.confirm(this.t('draw.confirmReset'))) return;
      this.busy = true;
      this.clearAdminError();
      const response = await this.api(this.drawPath('/api/admin/reset'), { method: 'POST', body: '{}' }, true);
      this.busy = false;
      if (!response.ok) { this.showAdminError(response); return; }
      this.toast(this.t('draw.resetDone'));
      await this.loadState();
    },

    /* ---------- participant ---------- */
    async loadDraw() {
      const response = await this.api(`/api/draw/${encodeURIComponent(this.token)}`, { method: 'GET' });
      if (!response.ok) {
        this.pError = true;
        this.toast(this.errorText(response, 'p.invalidSub'), 'error');
        return;
      }
      const wasPending = this.data.status === 'PENDING';
      this.data = response.body;
      this.participant = response.body.participant;
      this.wishlistDraft = response.body.participant.wishlist || '';
      this.savedWishlist = this.wishlistDraft;
      if (response.body.event_title) document.title = response.body.event_title;
      if (wasPending && response.body.status === 'READY') this.toast(this.t('p.readyTease'), 'info');
      if (response.body.status === 'PENDING') this.schedulePoll();
    },
    schedulePoll() {
      clearTimeout(this.poll);
      this.poll = setTimeout(() => { if (this.data.status === 'PENDING') this.loadDraw(); }, 25000);
    },
    async refreshParticipant() {
      this.busy = true;
      await this.loadDraw();
      this.busy = false;
    },
    reveal() {
      this.revealed = true;
      sessionStorage.setItem('ge_revealed_' + this.token, '1');
      this.burstOn = true;
      this.makeSnow(16, true);
      setTimeout(() => { this.burstOn = false; }, 2200);
    },
    async copyMyList() {
      const list = this.data.assignments.length
        ? this.data.assignments.map(a => `${a.name} (${this.t('role.' + a.role)})${a.wishlist ? ': ' + a.wishlist : ''}`).join('\n')
        : this.t('p.noGifts');
      if (!(await this.writeClipboard(list))) return;
      this.flashFlag('copiedList', true, false, 1800);
    },
    queueWishlistSave() {
      clearTimeout(this._saveTimer);
      if (!this.wishlistDirty) return;
      this._saveTimer = setTimeout(() => this.saveWishlist(), 1200);
    },
    async saveWishlist() {
      clearTimeout(this._saveTimer);
      if (!this.wishlistDirty) return;
      this.busy = true;
      const response = await this.api(`/api/draw/${encodeURIComponent(this.token)}/wishlist`,
        { method: 'PUT', body: JSON.stringify({ wishlist: this.wishlistDraft }) });
      this.busy = false;
      if (!response.ok) { this.toast(this.errorText(response, 'err.unknown'), 'error'); return; }
      this.savedWishlist = this.wishlistDraft;
      this.savedAt = new Date().toISOString();
    },

    /* ---------- ambience ---------- */
    makeSnow(count = 26, fast = false) {
      const host = document.getElementById('snow');
      if (!host) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const svgNS = 'http://www.w3.org/2000/svg';
      const palette = ['rgba(47,107,82,.30)', 'rgba(20,60,46,.16)', 'rgba(199,154,59,.55)', 'rgba(120,140,152,.30)'];
      for (let i = 0; i < count; i++) {
        const size = 8 + Math.random() * 18;
        const flake = document.createElementNS(svgNS, 'svg');
        flake.setAttribute('viewBox', '0 0 100 100');
        const use = document.createElementNS(svgNS, 'use');
        use.setAttribute('href', '#i-flake');
        flake.appendChild(use);
        flake.style.left = (Math.random() * 100) + 'vw';
        flake.style.width = size + 'px';
        flake.style.height = size + 'px';
        flake.style.opacity = (0.55 + Math.random() * 0.45).toFixed(2);
        const fall = fast ? 5 + Math.random() * 4 : 15 + Math.random() * 14;
        flake.style.animationDuration = `${fall}s, ${5 + Math.random() * 6}s`;
        flake.style.animationDelay = `${-Math.random() * fall}s, ${-Math.random() * 6}s`;
        flake.style.color = palette[Math.floor(Math.random() * palette.length)];
        host.appendChild(flake);
        flake.addEventListener('animationiteration', () => {
          if (fast) { flake.remove(); return; }
          flake.style.left = (Math.random() * 100) + 'vw';
        });
      }
    },
  };
}
</script>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.11.1/dist/cdn.min.js"></script>

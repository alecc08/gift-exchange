<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Échange de cadeaux · Gift Exchange</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Fraunces', 'Georgia', 'serif'],
          sans: ['Inter', 'system-ui', 'sans-serif'],
        },
        colors: {
          pine:  { 50: '#eef5f1', 100: '#d7e7de', 200: '#b3d0c2', 300: '#7aa894',
                   500: '#2f6b52', 600: '#1f5340', 700: '#143c2e', 800: '#0e2b21', 900: '#0a1f18' },
          holly: { 100: '#fbe9e7', 500: '#c0392f', 600: '#a52a20', 700: '#84201a' },
          gold:  { 100: '#f7eeda', 300: '#e6c98a', 400: '#d4af62', 500: '#c79a3b', 600: '#a87c26' },
          ivory: '#faf7f2',
        },
        boxShadow: {
          card: '0 1px 2px rgba(10,31,24,.06), 0 14px 34px -20px rgba(10,31,24,.38)',
          lift: '0 2px 4px rgba(10,31,24,.08), 0 26px 50px -26px rgba(10,31,24,.5)',
          glow: '0 0 0 1px rgba(199,154,59,.4), 0 20px 50px -18px rgba(199,154,59,.6)',
        },
      },
    },
  };
</script>

<style>
  [x-cloak] { display: none !important; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(47,107,82,.14), transparent 60%),
      radial-gradient(820px 520px at 96% 2%, rgba(192,57,47,.10), transparent 58%),
      radial-gradient(760px 700px at 50% 118%, rgba(199,154,59,.12), transparent 62%),
      #faf7f2;
  }
  .grain::after {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .35;
    background-image: radial-gradient(rgba(20,60,46,.10) .6px, transparent .7px);
    background-size: 4px 4px;
  }

  /* ---- shared bits ---- */
  .label { font-size: .6875rem; letter-spacing: .12em; text-transform: uppercase; color: #6b7a72; font-weight: 600; }
  .field {
    width: 100%; border-radius: .75rem; border: 1px solid rgba(20,60,46,.16); background: #fff;
    padding: .625rem .875rem; color: #14312a; transition: border-color .18s, box-shadow .18s;
  }
  .field:focus { outline: none; border-color: #c79a3b; box-shadow: 0 0 0 3px rgba(199,154,59,.20); }
  .field:disabled { background: #f1efe9; color: #7d8b84; cursor: not-allowed; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
         border-radius: .8rem; font-weight: 600; transition: transform .16s, box-shadow .18s, background .18s, color .18s; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: #143c2e; color: #fdfcf9; box-shadow: 0 10px 24px -14px rgba(20,60,46,.8); }
  .btn-primary:hover { background: #1f5340; }
  .btn-danger  { background: #fff; color: #84201a; border: 1px solid rgba(165,42,32,.35); }
  .btn-danger:hover { background: #a52a20; color: #fff; border-color: #a52a20; }
  .btn-quiet   { background: rgba(20,60,46,.06); color: #1f463a; }
  .btn-quiet:hover { background: rgba(20,60,46,.11); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .chip { display: inline-flex; align-items: center; gap: .3rem; padding: .25rem .6rem; border-radius: 999px;
          font-size: .6875rem; font-weight: 600; letter-spacing: .04em; }
  .hair { border-color: rgba(20,60,46,.10); }

  /* ---- falling snow ---- */
  #snow { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  #snow svg { position: absolute; top: -10vh; color: rgba(47,107,82,.22);
              animation-name: fall, sway; animation-iteration-count: infinite;
              animation-timing-function: linear, ease-in-out; }
  @keyframes fall { to { transform: translateY(118vh); } }
  @keyframes sway { 0%,100% { margin-left: 0 } 25% { margin-left: 14px } 75% { margin-left: -14px } }

  /* ---- gift reveal ---- */
  .gift-stage { position: relative; display: grid; place-items: center; padding: 1.25rem 0 .25rem; }
  .gift { width: 190px; height: 190px; overflow: visible; }
  .gift .box, .gift .lid { transform-box: fill-box; transform-origin: center bottom;
                           transition: transform .9s cubic-bezier(.34,1.4,.5,1), opacity .7s ease; }
  .gift .lid { transform-origin: center; }
  .gift.opened .lid { transform: translateY(-46px) rotate(-16deg); }
  .gift.opened .box { transform: translateY(4px); }
  .gift .steam { opacity: 0; transition: opacity .5s ease .15s; }
  .gift.opened .steam { opacity: 1; }
  .gift.opened .steam path { animation: rise 1.6s ease-in-out infinite; }
  @keyframes rise { 0% { transform: translateY(6px); opacity: 0 } 40% { opacity: .9 } 100% { transform: translateY(-14px); opacity: 0 } }
  .halo { position: absolute; inset: 0; margin: auto; width: 230px; height: 230px; border-radius: 999px;
          background: radial-gradient(circle, rgba(228,199,130,.55), rgba(228,199,130,0) 65%);
          opacity: 0; transform: scale(.7); transition: opacity .6s ease, transform .8s cubic-bezier(.2,.9,.3,1.2); }
  .revealed .halo { opacity: 1; transform: scale(1); }
  .sparkle { position: absolute; width: 22px; height: 22px; color: #d4af62; opacity: 0; }
  .sparkle.go { animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.6) rotate(0deg) } 50% { opacity: 1; transform: scale(1.15) rotate(25deg) } }
  .burst { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .burst svg { position: absolute; left: 50%; top: 42%; opacity: 0; }
  .burst.go svg { animation: pop 1.5s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(.3) rotate(0deg) }
    18%  { opacity: 1 }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)) }
  }
  .reveal-btn { position: relative; overflow: hidden; padding: .95rem 1.75rem; border-radius: 999px;
                background: linear-gradient(135deg, #143c2e, #1f5340 55%, #143c2e); color: #fbf6ea;
                letter-spacing: .14em; font-weight: 700; font-size: .8125rem; text-transform: uppercase;
                box-shadow: 0 14px 34px -16px rgba(20,60,46,.9), inset 0 0 0 1px rgba(212,175,98,.45); }
  .reveal-btn:hover { box-shadow: 0 18px 40px -14px rgba(20,60,46,.95), inset 0 0 0 1px rgba(212,175,98,.8); }
  .reveal-btn::after { content: ''; position: absolute; top: 0; bottom: 0; width: 45%;
                       background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent);
                       transform: translateX(-140%); }
  .reveal-btn:hover::after { animation: sheen 1.1s ease forwards; }
  @keyframes sheen { to { transform: translateX(240%) } }

  /* ---- entrance ---- */
  .fade-up { animation: fadeUp .55s cubic-bezier(.2,.7,.3,1) backwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  .pop-in { animation: popIn .4s cubic-bezier(.3,1.5,.5,1) backwards; }
  @keyframes popIn { from { opacity: 0; transform: scale(.96) } to { opacity: 1; transform: none } }

  /* ---- pending pulse ---- */
  .wrapped { animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.035) } }

  @media (prefers-reduced-motion: reduce) {
    *, *::after, *::before { animation-duration: .01ms !important; animation-iteration-count: 1 !important;
                             transition-duration: .01ms !important; }
    #snow { display: none; }
  }
</style>
</head>
<body class="font-sans text-pine-800 min-h-screen grain" x-data="giftExchange()" x-init="boot()">

<!-- Icon set: crystalline snowflake authored for this app; festive outline icons
     from Tabler Icons (MIT, https://tabler.io/icons) vendored inline, no CDN needed. -->

  <defs>
    <g id="flake-arm" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
      <path d="M50 50 L50 6"/>
      <path d="M50 20 L60 8.9"/><path d="M50 20 L40 8.9"/>
      <path d="M50 31 L57.1 22.6"/><path d="M50 31 L42.9 22.6"/>
      <path d="M41.7 13.9 L50 6 L58.3 13.9"/>
    </g>
    <symbol id="i-flake" viewBox="0 0 100 100">
      <use href="#flake-arm"/>
      <use href="#flake-arm" transform="rotate(60 50 50)"/>
      <use href="#flake-arm" transform="rotate(120 50 50)"/>
      <use href="#flake-arm" transform="rotate(180 50 50)"/>
      <use href="#flake-arm" transform="rotate(240 50 50)"/>
      <use href="#flake-arm" transform="rotate(300 50 50)"/>
      <circle cx="50" cy="50" r="3.4" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-tree" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l4 4l-2 1l4 4l-3 1l4 4h-14l4 -4l-3 -1l4 -4l-2 -1z"/>
      <path d="M14 17v3a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1v-3"/>
    </symbol>
    <symbol id="i-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8m0 1a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1z"/>
      <path d="M12 8l0 13"/>
      <path d="M19 12v7a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7"/>
      <path d="M7.5 8a2.5 2.5 0 0 1 0 -5a4.8 8 0 0 1 4.5 5a4.8 8 0 0 1 4.5 -5a2.5 2.5 0 0 1 0 5"/>
    </symbol>
    <symbol id="i-candy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.05 11.293l4.243 -4.243a2 2 0 0 1 2.828 0l2.829 2.83a2 2 0 0 1 0 2.828l-4.243 4.243a2 2 0 0 1 -2.828 0l-2.829 -2.831a2 2 0 0 1 0 -2.828z"/>
      <path d="M16.243 9.172l3.086 -.772a1.5 1.5 0 0 0 .697 -2.516l-2.216 -2.217a1.5 1.5 0 0 0 -2.44 .47l-1.248 2.913"/>
      <path d="M9.172 16.243l-.772 3.086a1.5 1.5 0 0 1 -2.516 .697l-2.217 -2.216a1.5 1.5 0 0 1 .47 -2.44l2.913 -1.248"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873z"/>
    </symbol>
    <symbol id="i-bauble" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="14.5" r="6.5"/>
      <path d="M10.5 7.9V6.4h3v1.5"/>
      <circle cx="12" cy="4.6" r="1.6"/>
      <path d="M8.6 11.4a4.2 4.2 0 0 0 -1.4 3.1"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12l5 5l10 -10"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.24 3.957l-8.422 14.06a1.926 1.926 0 0 0 1.657 2.983h16.845c.71 0 1.353-.39 1.657-.982l-8.423 -14.06a1.926 1.926 0 0 0 -3.314 0z"/>
      <path d="M12 9v4"/><path d="M12 17l.01 .017"/>

      <path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 11a8 8 0 0 1 -14.287 5.181l-1.713 -1.181"/>
      <path d="M4 13a8 8 0 0 1 14.287 -5.181l1.713 1.181"/>

</svg>

<div id="snow" aria-hidden="true"></div>

<div id="toasts" class="fixed bottom-5 right-5 z-50 flex flex-col items-end gap-2" aria-live="polite"></div>

<div class="relative z-10">

  <header class="max-w-5xl mx-auto px-5 pt-7 flex items-start justify-between gap-4">
    <div class="flex items-center gap-3">
      <span class="grid place-items-center w-11 h-11 rounded-2xl bg-pine-700 text-gold-300 shadow-card shrink-0">
        <svg class="w-5 h-5"><use href="#i-tree"/></svg>
      </span>
      <div>
        <p class="label" x-text="t('brand')"></p>
        <h1 class="font-display text-xl leading-tight text-pine-800" x-text="pageTitle"></h1>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex rounded-full bg-white/75 ring-1 ring-black/5 p-1 text-xs font-semibold" role="group" :aria-label="t('lang.switch')">
        <button @click="setLang('fr')" :class="lang === 'fr' ? 'bg-pine-700 text-white shadow-sm' : 'text-pine-600 hover:text-pine-800'"
                :title="t('lang.frTitle')" class="px-3 py-1.5 rounded-full transition">FR</button>
        <button @click="setLang('en')" :class="lang === 'en' ? 'bg-pine-700 text-white shadow-sm' : 'text-pine-600 hover:text-pine-800'"
                :title="t('lang.enTitle')" class="px-3 py-1.5 rounded-full transition">EN</button>
      </div>
      <button x-show="mode === 'admin' && authed" @click="lock()" class="btn btn-quiet px-3 py-2 text-xs" x-text="t('admin.lock')"></button>
    </div>
  </header>

  <!-- ===================== ADMIN ===================== -->
  <template x-if="mode === 'admin'">
    <div>

      <section x-show="!authed" class="max-w-md mx-auto mt-12 px-5 pop-in">
        <div class="bg-white rounded-3xl shadow-lift ring-1 ring-black/5 p-8">
          <div class="flex items-center gap-3">
            <span class="grid place-items-center w-10 h-10 rounded-2xl bg-holly-100 text-holly-600">
              <svg class="w-5 h-5"><use href="#i-bauble"/></svg>
            </span>
            <h2 class="font-display text-2xl text-pine-800" x-text="t('login.title')"></h2>
          </div>
          <p class="text-sm text-pine-600/85 mt-2 mb-6" x-text="t('login.sub')"></p>
          <form @submit.prevent="login">
            <label class="label" for="pw" x-text="t('login.password')"></label>
            <input id="pw" type="password" x-model="pwDraft" class="field mt-1.5" autocomplete="current-password"
                   :placeholder="t('login.placeholder')" autofocus :disabled="busy">
            <button class="btn btn-primary w-full mt-4 py-2.5" :disabled="busy || !pwDraft">
              <span x-text="busy ? t('login.checking') : t('login.button')"></span>
            </button>
          </form>
          <p x-show="loginError" x-cloak class="mt-3 text-sm text-holly-600 flex items-start gap-2">
            <svg class="w-4 h-4 shrink-0 mt-0.5"><use href="#i-alert"/></svg><span x-text="loginError"></span>
          </p>
        </div>
      </section>

      <div x-show="authed" x-cloak class="max-w-5xl mx-auto px-5 pt-8 pb-28 space-y-6">

        <div class="flex flex-wrap items-center justify-between gap-3 bg-white/85 backdrop-blur rounded-2xl ring-1 ring-black/5 px-5 py-4 shadow-card">
          <div class="flex items-center gap-2.5 flex-wrap">
            <span class="chip" :class="locked ? 'bg-gold-100 text-gold-600' : 'bg-pine-50 text-pine-600'">
              <span x-text="locked ? t('state.locked') : t('state.open')"></span>
            </span>
            <span class="text-sm text-pine-600" x-text="rosterSummary"></span>
            <span class="text-sm text-pine-600/70" x-text="giftForecast"></span>
          </div>
          <div class="flex items-center gap-2">
            <button @click="copyAllLinks()" :disabled="participants.length === 0" class="btn btn-quiet px-3 py-2 text-xs">
              <svg class="w-3.5 h-3.5"><use href="#i-link"/></svg>
              <span x-text="copiedAll ? t('roster.copied') : t('admin.copyAll')"></span>
            </button>
            <button @click="loadState()" class="btn btn-quiet px-3 py-2 text-xs">
              <svg class="w-3.5 h-3.5"><use href="#i-refresh"/></svg><span x-text="t('admin.refresh')"></span>
            </button>
          </div>
        </div>

        <div x-show="securityNotice" x-cloak class="rounded-2xl bg-gold-100 ring-1 ring-gold-500/25 px-5 py-3.5 flex items-start gap-3">
          <svg class="w-4 h-4 text-gold-600 shrink-0 mt-0.5"><use href="#i-alert"/></svg>
          <p class="text-sm text-gold-600" x-text="securityNotice"></p>
        </div>

        <div x-show="warnings.length" x-cloak class="rounded-2xl bg-holly-100/70 ring-1 ring-holly-500/20 px-5 py-4">
          <p class="text-sm font-semibold text-holly-700 flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0"><use href="#i-alert"/></svg><span x-text="t('warn.title')"></span>
          </p>
          <template x-for="warning in warnings" :key="warning">
            <p class="text-sm text-holly-700/85 mt-1 pl-6" x-text="warning"></p>
          </template>
        </div>

        <div x-show="adminError" x-cloak class="rounded-2xl bg-holly-100 ring-1 ring-holly-500/25 px-5 py-4 flex items-start gap-3 fade-up">
          <svg class="w-5 h-5 text-holly-600 shrink-0 mt-0.5"><use href="#i-alert"/></svg>
          <div>
            <p class="text-sm font-semibold text-holly-700" x-text="adminErrorTitle"></p>
            <p class="text-sm text-holly-700/85 mt-0.5" x-text="adminError"></p>
          </div>
          <button @click="adminError=''" class="ml-auto text-holly-700/60 hover:text-holly-700 text-lg leading-none">&times;</button>
        </div>

        <!-- Panel 1 — rules & quotas -->
        <section class="bg-white rounded-3xl ring-1 ring-black/5 shadow-card p-6 md:p-8">
          <div class="flex items-start justify-between gap-4">
            <div>
              <p class="label" x-text="t('rules.kicker')"></p>
              <h2 class="font-display text-2xl text-pine-800" x-text="t('rules.title')"></h2>
            </div>
            <svg class="w-7 h-7 text-gold-500 shrink-0"><use href="#i-candy"/></svg>
          </div>

          <div class="grid md:grid-cols-2 gap-4 mt-6">
            <div>
              <label class="label" for="title" x-text="t('rules.eventTitle')"></label>
              <input id="title" class="field mt-1.5" x-model="cfg.event_title" :disabled="locked"
                     :maxlength="limits.event_title">
              <p class="text-[11px] text-pine-600/60 mt-1 text-right"
                 x-text="(cfg.event_title || '').length + '/' + limits.event_title"></p>
            </div>
            <div>
              <label class="label" for="budget" x-text="t('rules.budget')"></label>
              <input id="budget" class="field mt-1.5" x-model="cfg.budget_note" :disabled="locked"
                     :placeholder="t('rules.budgetPlaceholder')" :maxlength="limits.budget_note">
              <p class="text-[11px] text-pine-600/60 mt-1 text-right"
                 x-text="(cfg.budget_note || '').length + '/' + limits.budget_note"></p>
            </div>
          </div>

          <div class="mt-7">
            <p class="label mb-2" x-text="t('rules.quotas')"></p>
            <div class="rounded-2xl ring-1 ring-black/8 overflow-hidden">
              <table class="w-full text-sm">
                <thead>
                  <tr class="bg-pine-50/80 text-pine-700">
                    <th class="p-3 text-left font-semibold" x-text="t('rules.whoDraws')"></th>
                    <th class="p-3 text-center font-semibold" x-text="t('role.ADULT')"></th>
                    <th class="p-3 text-center font-semibold" x-text="t('role.CHILD')"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-black/5">
                  <tr>
                    <td class="p-3 text-pine-700 font-medium" x-text="t('rules.eachAdult')"></td>
                    <td class="p-3 text-center">
                      <input type="number" min="0" :max="limits.max_quota" class="field w-20 text-center mx-auto"
                             x-model.number="cfg.adult_draws_adult" :disabled="locked"
                             :aria-label="t('rules.eachAdult') + ' → ' + t('role.ADULT')">
                    </td>
                    <td class="p-3 text-center">
                      <input type="number" min="0" :max="limits.max_quota" class="field w-20 text-center mx-auto"
                             x-model.number="cfg.adult_draws_child" :disabled="locked"
                             :aria-label="t('rules.eachAdult') + ' → ' + t('role.CHILD')">
                    </td>
                  </tr>
                  <tr>
                    <td class="p-3 text-pine-700 font-medium" x-text="t('rules.eachChild')"></td>
                    <td class="p-3 text-center">
                      <input type="number" min="0" :max="limits.max_quota" class="field w-20 text-center mx-auto"
                             x-model.number="cfg.child_draws_adult" :disabled="locked"
                             :aria-label="t('rules.eachChild') + ' → ' + t('role.ADULT')">
                    </td>
                    <td class="p-3 text-center">
                      <input type="number" min="0" :max="limits.max_quota" class="field w-20 text-center mx-auto"
                             x-model.number="cfg.child_draws_child" :disabled="locked"
                             :aria-label="t('rules.eachChild') + ' → ' + t('role.CHILD')">
                    </td>
                  </tr>
                </tbody>
                <tfoot>
                  <tr class="bg-pine-50/50 text-pine-700">
                    <td class="p-3 text-xs font-semibold" x-text="t('rules.totalToPrepare')"></td>
                    <td class="p-3 text-center text-xs font-semibold" x-text="totals.toAdults"></td>
                    <td class="p-3 text-center text-xs font-semibold" x-text="totals.toChildren"></td>
                  </tr>
                </tfoot>
              </table>
            </div>
            <p class="text-xs text-pine-600/75 mt-2" x-text="t('rules.quotaHelp')"></p>
          </div>

          <div class="flex flex-wrap items-center gap-3 mt-6">
            <button @click="saveConfig()" :disabled="locked || busy || !rulesDirty" class="btn btn-primary px-5 py-2.5 text-sm">
              <svg class="w-3.5 h-3.5"><use href="#i-check"/></svg>
              <span x-text="t('rules.save')"></span>
            </button>
            <span x-show="rulesDirty" x-cloak class="chip bg-gold-100 text-gold-600" x-text="t('rules.unsaved')"></span>
            <p x-show="locked" x-cloak class="text-xs text-gold-600 flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5"><use href="#i-alert"/></svg><span x-text="t('rules.lockedHint')"></span>
            </p>
          </div>
        </section>

        <!-- Panel 2 — participant roster -->
        <section class="bg-white rounded-3xl ring-1 ring-black/5 shadow-card p-6 md:p-8">
          <div class="flex items-start justify-between gap-4">
            <div>
              <p class="label" x-text="t('roster.kicker')"></p>
              <h2 class="font-display text-2xl text-pine-800" x-text="t('roster.title')"></h2>
            </div>
            <svg class="w-7 h-7 text-pine-300 shrink-0"><use href="#i-flake"/></svg>
          </div>

          <form @submit.prevent="addParticipant()" class="mt-6 grid sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">
            <div>
              <label class="label" for="p-name" x-text="t('roster.name')"></label>
              <input id="p-name" class="field mt-1.5" x-model.trim="draft.name" :disabled="locked"
                     :placeholder="t('roster.namePlaceholder')" :maxlength="limits.name" autocomplete="off">
            </div>
            <div>
              <label class="label" for="p-role" x-text="t('roster.role')"></label>
              <select id="p-role" class="field mt-1.5" x-model="draft.role" :disabled="locked">
                <option value="ADULT" x-text="t('role.ADULT')"></option>
                <option value="CHILD" x-text="t('role.CHILD')"></option>
              </select>
            </div>
            <div>
              <label class="label" for="p-group" x-text="t('roster.group')"></label>
              <input id="p-group" class="field mt-1.5" x-model.trim="draft.family_group" :disabled="locked"
                     :placeholder="t('roster.groupPlaceholder')" :maxlength="limits.family_group"
                     list="group-options" autocomplete="off">
              <datalist id="group-options">
                <template x-for="g in familyGroups" :key="g.name">
                  <option :value="g.name"></option>
                </template>
              </datalist>
            </div>
            <div>
              <label class="label" for="p-wish" x-text="t('roster.wishlist')"></label>
              <div class="flex gap-2 mt-1.5">
                <input id="p-wish" class="field" x-model.trim="draft.wishlist" :disabled="locked"
                       :placeholder="t('roster.wishlistPlaceholder')" :maxlength="limits.wishlist">
                <button type="submit" :disabled="locked || busy || !draftReady"
                        class="btn btn-primary px-4 py-2.5 text-sm shrink-0" x-text="t('roster.add')"></button>
              </div>
            </div>
          </form>

          <div class="flex flex-wrap items-center gap-2 mt-3">
            <p class="text-xs text-pine-600/80 flex items-center gap-2 mr-1">
              <svg class="w-3.5 h-3.5 text-pine-300 shrink-0"><use href="#i-flake"/></svg>
              <span x-text="t('roster.groupHelp')"></span>
            </p>
            <template x-for="g in familyGroups" :key="g.name">
              <button @click="groupFilter = groupFilter === g.name ? '' : g.name"
                      class="chip transition"
                      :class="groupFilter === g.name ? 'bg-pine-700 text-white' : 'bg-pine-50 text-pine-600 hover:bg-pine-100'">
                <span x-text="g.name"></span><span class="opacity-70" x-text="'· ' + g.count"></span>
              </button>
            </template>
            <button x-show="groupFilter" x-cloak @click="groupFilter = ''" class="chip bg-black/5 text-pine-600"
                    x-text="t('roster.filterOff')"></button>
          </div>

          <div class="mt-5 overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-pine-700/80 border-b hair">
                  <th class="py-2.5 pr-3 text-left label" x-text="t('roster.name')"></th>
                  <th class="py-2.5 px-3 text-left label" x-text="t('roster.role')"></th>
                  <th class="py-2.5 px-3 text-left label" x-text="t('roster.group')"></th>
                  <th class="py-2.5 px-3 text-left label" x-text="t('roster.status')"></th>
                  <th class="py-2.5 pl-3 text-right label" x-text="t('roster.actions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-black/5">
                <tr x-show="visibleParticipants.length === 0">
                  <td colspan="5" class="py-8 text-center text-pine-600/70" x-text="t('roster.empty')"></td>
                </tr>
                <template x-for="p in visibleParticipants" :key="p.id">
                  <tr class="hover:bg-pine-50/40 transition">
                    <td class="py-3 pr-3 align-top">
                      <p class="font-semibold text-pine-800" x-text="p.name"></p>
                      <p x-show="p.wishlist" x-cloak class="text-xs text-pine-600/75 mt-0.5 max-w-[22rem] truncate"
                         :title="p.wishlist" x-text="t('roster.wishlistIs') + ' ' + p.wishlist"></p>
                    </td>
                    <td class="py-3 px-3 align-top">
                      <span class="chip" :class="p.role === 'ADULT' ? 'bg-pine-50 text-pine-600' : 'bg-gold-100 text-gold-600'"
                            x-text="t('role.' + p.role)"></span>
                      <p class="text-[11px] text-pine-600/65 mt-1"
                         x-text="drawsOf(p) ? t('roster.giftsN', { n: drawsOf(p) }) : t('roster.noGiftsNote')"></p>
                    </td>
                    <td class="py-3 px-3 align-top text-pine-700" x-text="p.family_group"></td>
                    <td class="py-3 px-3 align-top">
                      <span x-show="p.viewed_at" x-cloak class="chip bg-pine-100 text-pine-700" :title="formatDate(p.viewed_at)">
                        <svg class="w-3 h-3"><use href="#i-check"/></svg>
                        <span x-text="t('roster.viewed')"></span>
                        <span class="font-normal opacity-75" x-text="relative(p.viewed_at)"></span>
                      </span>
                      <span x-show="!p.viewed_at" class="chip bg-black/5 text-pine-600/70" x-text="t('roster.unopened')"></span>
                    </td>
                    <td class="py-3 pl-3 align-top text-right whitespace-nowrap">
                      <button @click="copyLink(p)" :disabled="!p.token" class="btn btn-quiet px-3 py-1.5 text-xs">
                        <svg class="w-3 h-3"><use href="#i-link"/></svg>
                        <span x-text="copiedId === p.id ? t('roster.copied') : t('roster.copy')"></span>
                      </button>
                      <button x-show="!locked" x-cloak @click="removeParticipant(p)" :aria-label="t('roster.delete') + ' ' + p.name"
                              class="btn btn-danger px-3 py-1.5 text-xs ml-2" x-text="t('roster.delete')"></button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>

        <!-- Panel 3 — execution -->
        <section class="bg-white rounded-3xl ring-1 ring-black/5 shadow-card p-6 md:p-8">
          <div class="flex items-start justify-between gap-4">
            <div>
              <p class="label" x-text="t('draw.kicker')"></p>
              <h2 class="font-display text-2xl text-pine-800" x-text="t('draw.title')"></h2>
            </div>
            <svg class="w-7 h-7 text-gold-500 shrink-0"><use href="#i-gift"/></svg>
          </div>

          <p class="text-sm text-pine-600 mt-4 leading-relaxed" x-text="locked ? t('draw.lockedCopy') : t('draw.openCopy')"></p>
          <p class="text-xs text-pine-600/75 mt-2" x-text="t('draw.blindNote')"></p>

          <div x-show="!locked && participants.length === 0" x-cloak
               class="mt-5 rounded-2xl bg-pine-50/70 ring-1 ring-pine-500/15 px-4 py-3">
            <p class="text-sm text-pine-700" x-text="t('draw.needRoster')"></p>
          </div>

          <div x-show="!locked && participants.length > 0" x-cloak class="flex flex-wrap items-center gap-3 mt-6">
            <button @click="runDraw()" :disabled="busy || warnings.length > 0" class="btn btn-primary px-6 py-3 text-sm">
              <svg class="w-4 h-4"><use href="#i-star"/></svg>
              <span x-text="t('draw.generate')"></span>
            </button>
            <span class="text-xs text-pine-600/75" x-text="giftForecast"></span>
            <span x-show="warnings.length > 0" x-cloak class="chip bg-holly-100 text-holly-600"
                  x-text="t('draw.blockedByWarnings')"></span>
          </div>

          <div x-show="locked" x-cloak class="flex flex-wrap items-center gap-3 mt-6">
            <button @click="resetDraw()" class="btn btn-danger px-5 py-2.5 text-sm" x-text="t('draw.reset')"></button>
            <span class="text-xs text-pine-600/75" x-text="t('draw.resetHint')"></span>
            <span class="chip" :class="openedCount ? 'bg-pine-100 text-pine-700' : 'bg-black/5 text-pine-600/70'"
                  x-text="t('draw.openedCount', { n: openedCount, total: participants.length })"></span>
          </div>
        </section>
      </div>
    </div>
  </template>

  <!-- ===================== PARTICIPANT ===================== -->
  <template x-if="mode === 'participant'">
    <div class="max-w-2xl mx-auto px-5 pt-10 pb-28 space-y-6">

      <section x-show="pError" x-cloak class="bg-white rounded-3xl ring-1 ring-black/5 shadow-lift p-9 text-center pop-in">
        <span class="grid place-items-center w-12 h-12 rounded-2xl bg-holly-100 text-holly-600 mx-auto">
          <svg class="w-6 h-6"><use href="#i-alert"/></svg>
        </span>
        <h2 class="font-display text-2xl text-pine-800 mt-4" x-text="t('p.invalidTitle')"></h2>
        <p class="text-sm text-pine-600 mt-2" x-text="t('p.invalidSub')"></p>
      </section>

      <template x-if="!pError && participant">
        <div class="space-y-6">

          <section class="bg-white rounded-[2rem] ring-1 ring-black/5 shadow-lift p-8 md:p-10 text-center relative overflow-hidden"
                   :class="revealed ? 'revealed' : ''">
            <svg class="absolute -right-8 -top-8 w-32 h-32 text-pine-100 pointer-events-none"><use href="#i-flake"/></svg>
            <svg class="absolute -left-10 bottom-0 w-24 h-24 text-gold-100 pointer-events-none"><use href="#i-flake"/></svg>

            <p class="label" x-text="data.event_title"></p>
            <h2 class="font-display text-3xl md:text-4xl text-pine-800 mt-1.5"
                x-text="t('p.hello') + ' ' + participant.name"></h2>
            <p x-show="data.budget_note" x-cloak class="text-sm text-pine-600 mt-3" x-text="data.budget_note"></p>

            <!-- gift on stage -->
            <div class="gift-stage" x-show="data.status === 'READY'" x-cloak>
              <div class="halo"></div>
              <div class="burst" :class="burstOn ? 'go' : ''">
                <template x-for="(b, i) in burst" :key="i">
                  <svg :style="`--dx:${b.dx}px;--dy:${b.dy}px;--rot:${b.rot}deg;width:${b.size}px;height:${b.size}px;animation-delay:${b.delay}ms`">
                    <use href="#i-flake"/>
                  </svg>
                </template>
              </div>
              <svg class="sparkle go" style="left:22%;top:12%" viewBox="0 0 24 24"><use href="#i-star"/></svg>
              <svg class="sparkle go" style="left:76%;top:20%;animation-delay:.7s" viewBox="0 0 24 24"><use href="#i-star"/></svg>
              <svg class="sparkle go" style="left:66%;top:72%;animation-delay:1.3s" viewBox="0 0 24 24"><use href="#i-star"/></svg>

              <svg class="gift" :class="revealed ? 'opened' : 'wrapped'" viewBox="0 0 200 200" role="img" :aria-label="t('p.giftAria')">
                <defs>
                  <linearGradient id="boxSheen" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
                    <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#c79a3b" stop-opacity=".14"/>
                  </linearGradient>
                </defs>
                <ellipse cx="100" cy="184" rx="54" ry="7" fill="rgba(20,60,46,.10)"/>
                <g class="box">
                  <rect x="52" y="98" width="96" height="78" rx="9" fill="#143c2e"/>
                  <rect x="52" y="98" width="96" height="78" rx="9" fill="url(#boxSheen)"/>
                  <rect x="93" y="98" width="14" height="78" fill="#c79a3b"/>
                </g>
                <g class="steam">
                  <path d="M78 92 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#d4af62" stroke-width="3" stroke-linecap="round" opacity=".8"/>
                  <path d="M100 88 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#e6c98a" stroke-width="3" stroke-linecap="round" opacity=".9"/>
                  <path d="M122 92 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#d4af62" stroke-width="3" stroke-linecap="round" opacity=".8"/>
                </g>
                <g class="lid">
                  <rect x="44" y="80" width="112" height="24" rx="8" fill="#1f5340"/>
                  <rect x="44" y="80" width="112" height="24" rx="8" fill="url(#boxSheen)"/>
                  <rect x="93" y="80" width="14" height="24" fill="#e6c98a"/>
                  <path d="M100 80 C 80 72, 72 56, 85 52 C 96 49, 100 63, 100 72 C 100 63, 104 49, 115 52 C 128 56, 120 72, 100 80 Z"
                        fill="#c79a3b"/>
                  <circle cx="100" cy="73" r="5.5" fill="#f7eeda"/>
                  <g opacity=".95">
                    <circle cx="63" cy="94" r="4" fill="#c0392f"/><circle cx="72" cy="98" r="3.4" fill="#a52a20"/>
                    <circle cx="67" cy="104" r="3" fill="#c0392f"/>
                  </g>
                </g>
              </svg>
            </div>

            <!-- PENDING -->
            <template x-if="data.status === 'PENDING'">
              <div class="mt-6">
                <svg class="w-16 h-16 text-pine-300 wrapped mx-auto"><use href="#i-gift"/></svg>
                <p class="text-pine-700 mt-4" x-text="t('p.pending')"></p>
                <div class="flex items-center justify-center gap-2 mt-4">
                  <button @click="refreshParticipant()" class="btn btn-quiet px-3 py-1.5 text-xs" :disabled="busy">
                    <svg class="w-3.5 h-3.5"><use href="#i-refresh"/></svg>
                    <span x-text="t('p.checkAgain')"></span>
                  </button>
                  <span class="text-[11px] text-pine-600/65" x-text="t('p.autoCheck')"></span>
                </div>
              </div>
            </template>

            <!-- READY, not revealed -->
            <template x-if="data.status === 'READY' && !revealed">
              <div class="mt-4">
                <p class="text-pine-700" x-text="t('p.readyTease')"></p>
                <button id="reveal-btn" class="reveal-btn mt-5" @click="reveal()" autofocus>
                  <span x-text="data.assignments.length ? t('p.reveal') : t('p.revealNone')"></span>
                </button>
                <p class="text-[11px] text-pine-600/70 mt-3" x-text="t('p.privateNote')"></p>
              </div>
            </template>

            <!-- READY, revealed -->
            <div x-show="revealed" x-cloak class="mt-5">
              <h3 class="font-display text-xl text-pine-800" x-text="t('p.revealTitle')"></h3>
              <p class="text-xs text-pine-600/75 mt-1" x-text="t('p.revealSub')"></p>
            </div>
          </section>

          <template x-if="revealed">
            <div class="space-y-4">
              <p x-show="data.assignments.length === 0" x-cloak
                 class="bg-white rounded-3xl ring-1 ring-black/5 shadow-card p-7 text-center fade-up">
                <svg class="w-8 h-8 text-gold-400 mx-auto mb-2"><use href="#i-flake"/></svg>
                <span class="text-pine-700" x-text="t('p.noGifts')"></span>
              </p>

              <template x-for="(a, i) in data.assignments" :key="a.name + i">
                <article class="bg-white rounded-3xl ring-1 ring-black/5 shadow-card p-5 md:p-6 fade-up"
                         :style="`animation-delay:${i * 120}ms`">
                  <div class="flex items-start gap-4">
                    <span class="grid place-items-center w-11 h-11 rounded-2xl shrink-0"
                          :class="a.role === 'ADULT' ? 'bg-pine-50 text-pine-600' : 'bg-gold-100 text-gold-600'">
                      <svg class="w-5 h-5"><use :href="a.role === 'ADULT' ? '#i-bauble' : '#i-gift'"/></svg>
                    </span>
                    <div class="min-w-0">
                      <div class="flex items-center gap-2.5 flex-wrap">
                        <h3 class="font-display text-xl text-pine-800" x-text="a.name"></h3>
                        <span class="chip" :class="a.role === 'ADULT' ? 'bg-pine-50 text-pine-600' : 'bg-gold-100 text-gold-600'"
                              x-text="t('role.' + a.role)"></span>
                      </div>
                      <p x-show="a.wishlist" x-cloak class="text-sm text-pine-600 mt-2 leading-relaxed">
                        <span class="label block mb-0.5" x-text="t('p.theirWishlist')"></span>
                        <span x-text="a.wishlist"></span>
                      </p>
                      <p x-show="!a.wishlist" class="text-xs text-pine-600/60 mt-2 italic" x-text="t('p.noWishlist')"></p>
                    </div>
                  </div>
                </article>
              </template>

              <div x-show="data.assignments.length" x-cloak class="flex items-center gap-2 pt-1">
                <button @click="copyMyList()" class="btn btn-quiet px-3 py-1.5 text-xs">
                  <svg class="w-3.5 h-3.5"><use href="#i-link"/></svg>
                  <span x-text="copiedList ? t('roster.copied') : t('p.copyList')"></span>
                </button>
              </div>
            </div>
          </template>

          <!-- own wishlist -->
          <section class="bg-white rounded-3xl ring-1 ring-black/5 shadow-card p-6 md:p-7">
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4 text-gold-500"><use href="#i-star"/></svg>
              <h3 class="font-display text-lg text-pine-800" x-text="t('p.myWishlist')"></h3>
            </div>
            <p class="text-xs text-pine-600/75 mt-1" x-text="t('p.myWishlistHelp')"></p>
            <textarea class="field mt-3" rows="3" x-model="wishlistDraft" @input="queueWishlistSave()"
                      @keydown.meta.enter.prevent="saveWishlist()" @keydown.ctrl.enter.prevent="saveWishlist()"
                      :placeholder="t('p.wishlistPlaceholder')" :maxlength="limits.wishlist"></textarea>
            <div class="flex flex-wrap items-center gap-3 mt-3">
              <button @click="saveWishlist()" :disabled="busy || !wishlistDirty" class="btn btn-primary px-5 py-2.5 text-sm"
                      x-text="t('p.save')"></button>
              <span x-show="wishlistDirty" x-cloak class="chip bg-gold-100 text-gold-600" x-text="t('p.unsaved')"></span>
              <p x-show="!wishlistDirty && savedAt" x-cloak class="text-xs text-pine-600 flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5"><use href="#i-check"/></svg>
                <span x-text="t('p.savedAt', { at: relative(savedAt) })"></span>
              </p>
              <span class="text-[11px] text-pine-600/60 ml-auto"
                    x-text="(wishlistDraft || '').length + '/' + limits.wishlist"></span>
            </div>
          </section>
        </div>
      </template>
    </div>
  </template>
</div>

/* ------------------------------- app ------------------------------- */
const DEFAULT_LIMITS = { name: 80, family_group: 60, wishlist: 1000, event_title: 120, budget_note: 500, max_quota: 10, default_password: false };

function giftExchange() {
  return {
    lang: localStorage.getItem('ge_lang') || 'fr',
    mode: 'admin',
    token: null,
    limits: { ...DEFAULT_LIMITS },

    authed: false, busy: false, loginError: '', pwDraft: '',
    adminError: '', adminErrorTitle: '', securityNotice: '',
    cfg: { event_title: '', budget_note: '', adult_draws_adult: 1, adult_draws_child: 2, child_draws_adult: 0, child_draws_child: 0 },
    savedCfg: null,
    participants: [], locked: false, groupFilter: '',
    draft: { name: '', role: 'ADULT', family_group: '', wishlist: '' },
    copiedId: null, copiedAll: false,

    participant: null, data: { status: '', assignments: [] }, pError: false,
    revealed: false, burstOn: false, wishlistDraft: '', savedWishlist: '', savedAt: null,
    wishlistSaved: false, copiedList: false, poll: null,
    burst: [],

    /* ---------- helpers ---------- */
    t(key, vars) {
      const table = I18N[this.lang] || I18N.fr;
      let text = table[key] ?? I18N.fr[key] ?? key;
      if (vars) for (const [k, v] of Object.entries(vars)) text = text.split('{' + k + '}').join(v);
      return text;
    },
    get pageTitle() {
      if (this.mode === 'participant') return this.data.event_title || this.t('brand');
      return this.cfg.event_title || this.t('admin.title');
    },
    get adults() { return this.participants.filter(p => p.role === 'ADULT'); },
    get children() { return this.participants.filter(p => p.role === 'CHILD'); },
    get rosterSummary() {
      return this.t('roster.summary', { n: this.participants.length, a: this.adults.length, c: this.children.length });
    },
    get totals() {
      const cfg = this.cfg, a = this.adults.length, c = this.children.length;
      const toAdults = a * (cfg.adult_draws_adult || 0) + c * (cfg.child_draws_adult || 0);
      const toChildren = a * (cfg.adult_draws_child || 0) + c * (cfg.child_draws_child || 0);
      return { toAdults, toChildren, gifts: toAdults + toChildren };
    },
    get giftForecast() {
      return this.t('draw.forecast', { gifts: this.totals.gifts, toAdults: this.totals.toAdults, toChildren: this.totals.toChildren });
    },
    get familyGroups() {
      const counts = new Map();
      for (const p of this.participants) {
        const key = p.family_group.trim().toLowerCase();
        const found = counts.get(key);
        if (found) found.count += 1;
        else counts.set(key, { name: p.family_group, count: 1 });
      }
      return [...counts.values()].sort((x, y) => y.count - x.count || x.name.localeCompare(y.name));
    },
    get visibleParticipants() {
      if (!this.groupFilter) return this.participants;
      const wanted = this.groupFilter.trim().toLowerCase();
      return this.participants.filter(p => p.family_group.trim().toLowerCase() === wanted);
    },
    get openedCount() { return this.participants.filter(p => p.viewed_at).length; },
    get rulesDirty() {
      return this.savedCfg && JSON.stringify(this.savedCfg) !== JSON.stringify(this.cfg);
    },
    /* Client-side mirror of the engine's hard rules: warn before the organizer wastes a draw. */
    get warnings() {
      const out = [];
      if (this.participants.length === 0 || this.locked) return out;
      if (this.participants.length === 1) return [this.t('warn.selfOnly')];
      const cfg = this.cfg;
      const eligible = (p, pool) => pool.filter(q => q.family_group.trim().toLowerCase() !== p.family_group.trim().toLowerCase()).length;
      const check = (sample, need, pool, key) => {
        if (need <= 0) return;
        if (pool.length === 0) { out.push(this.t('warn.noReceivers', { role: this.t('role.' + sample.role) })); return; }
        const worst = Math.min(...pool.map(q => eligible(q, pool)));
        if (need > worst) out.push(this.t(key, { need, available: worst }));
      };
      if (this.adults.length) {
        check(this.adults[0], cfg.adult_draws_adult, this.adults, 'warn.adultsNeed');
        check(this.adults[0], cfg.adult_draws_child, this.children, 'warn.childrenNeed');
      }
      if (this.children.length) {
        check(this.children[0], cfg.child_draws_adult, this.adults, 'warn.childAdultsNeed');
        check(this.children[0], cfg.child_draws_child, this.children, 'warn.childChildrenNeed');
      }
      return [...new Set(out)];
    },
    drawsOf(p) {
      const cfg = this.cfg;
      return p.role === 'ADULT'
        ? (cfg.adult_draws_adult || 0) + (cfg.adult_draws_child || 0)
        : (cfg.child_draws_adult || 0) + (cfg.child_draws_child || 0);
    },
    get draftReady() { return !!(this.draft.name && this.draft.family_group); },
    get wishlistDirty() { return this.wishlistDraft !== this.savedWishlist; },
    /* Quebec French for dates/relative times ("il y a 5 minutes", 24 h clock);
       Canadian English for the EN switch. */
    locale() { return this.lang === 'fr' ? 'fr-CA' : 'en-CA'; },
    formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat(this.locale(), { dateStyle: 'medium', timeStyle: 'short' }).format(date);
    },
    relative(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const seconds = Math.round((Date.now() - date.getTime()) / 1000);
      const rtf = new Intl.RelativeTimeFormat(this.locale(), { numeric: 'auto' });
      if (Math.abs(seconds) < 60) return rtf.format(-seconds, 'second');
      if (Math.abs(seconds) < 3600) return rtf.format(-Math.round(seconds / 60), 'minute');
      if (Math.abs(seconds) < 86400) return rtf.format(-Math.round(seconds / 3600), 'hour');
      return rtf.format(-Math.round(seconds / 86400), 'day');
    },

    /* ---------- boot ---------- */
    async boot() {
      document.documentElement.lang = this.locale();
      this.burst = Array.from({ length: 14 }, (_unused, i) => {
        const angle = (i / 14) * Math.PI * 2 + Math.random() * 0.4;
        const distance = 90 + Math.random() * 90;
        return {
          dx: Math.round(Math.cos(angle) * distance),
          dy: Math.round(Math.sin(angle) * distance - 30),
          rot: Math.round(Math.random() * 260 - 130),
          size: 12 + Math.round(Math.random() * 16),
          delay: Math.round(Math.random() * 260),
        };
      });
      this.makeSnow();
      await this.loadLimits();

      const params = new URLSearchParams(window.location.search);
      this.token = params.get('t');
      if (this.token) {
        this.mode = 'participant';
        this.revealed = sessionStorage.getItem('ge_revealed_' + this.token) === '1';
        await this.loadDraw();
      } else if (sessionStorage.getItem('ge_admin_token') || sessionStorage.getItem('admin_pw')) {
        this.authed = true;
        await this.loadState();
      }
    },

    setLang(lang) {
      this.lang = lang;
      localStorage.setItem('ge_lang', lang);
      document.documentElement.lang = this.locale();
    },

    async loadLimits() {
      try {
        const response = await fetch('/api/limits');
        if (!response.ok) return;
        this.limits = { ...DEFAULT_LIMITS, ...(await response.json()) };
        if (this.limits.default_password) this.securityNotice = this.t('notice.defaultPassword');
      } catch (_err) { /* offline: keep defaults */ }
    },

    /* ---------- toasts ---------- */
    toast(message, kind = 'info') {
      const host = document.getElementById('toasts');
      if (!host) return;
      const node = document.createElement('div');
      const palette = kind === 'error'
        ? 'bg-holly-100 ring-holly-500/30 text-holly-700'
        : kind === 'warn' ? 'bg-gold-100 ring-gold-500/30 text-gold-600' : 'bg-white ring-black/5 text-pine-700';
      node.className = `pop-in flex items-start gap-2 max-w-sm rounded-2xl px-4 py-3 text-sm shadow-lift ring-1 ${palette}`;
      node.textContent = message;
      host.appendChild(node);
      setTimeout(() => {
        node.style.transition = 'opacity .3s ease, transform .3s ease';
        node.style.opacity = '0';
        node.style.transform = 'translateY(6px)';
        setTimeout(() => node.remove(), 320);
      }, kind === 'error' ? 6500 : 3800);
    },

    /* ---------- transport ---------- */
    authHeaders() {
      const headers = {};
      const bearer = sessionStorage.getItem('ge_admin_token');
      if (bearer) headers['Authorization'] = 'Bearer ' + bearer;
      const legacy = sessionStorage.getItem('admin_pw');
      if (legacy) headers['X-Admin-Password'] = legacy;
      return headers;
    },
    async api(path, options = {}, withAuth = false) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (withAuth) Object.assign(headers, this.authHeaders());
      const response = await fetch(path, { ...options, headers });
      if (withAuth && response.status === 401) {
        sessionStorage.removeItem('ge_admin_token');
        this.authed = false;
        this.toast(this.t('login.expired'), 'warn');
      }
      let body = null;
      try { body = await response.json(); } catch (_err) { /* empty body */ }
      return { ok: response.ok, status: response.status, body, headers: response.headers };
    },
    errorText(response, fallbackKey) {
      const detail = typeof response?.body?.detail === 'string' ? response.body.detail : '';
      if (response.status === 401) return this.t(fallbackKey || 'err.unknown');   // "Unauthorized" is not user-facing
      if (response.status === 429) {
        const seconds = parseInt(response.headers?.get?.('retry-after') || '30', 10);
        return this.t('err.rateLimited', { s: Number.isFinite(seconds) ? seconds : 30 });
      }
      if (response.status === 413) return this.t('err.tooLarge');
      if (detail.includes('unsolvable')) return this.t('err.unsolvable');
      if (detail.includes('empty target group')) return this.t('err.emptyTarget');
      if (detail.includes('locked')) return this.t('err.locked');
      if (detail.includes('no participants')) return this.t('err.noParticipants');
      return detail || this.t(fallbackKey || 'err.unknown');
    },
    showAdminError(response, fallbackKey) {
      this.adminErrorTitle = response.status === 429
        ? this.t('err.rateLimitedTitle') : this.t('err.title');
      this.adminError = this.errorText(response, fallbackKey);
    },
    clearAdminError() { this.adminError = ''; this.adminErrorTitle = ''; },

    /* ---------- admin ---------- */
    async login() {
      this.busy = true;
      this.loginError = '';
      const response = await this.api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: this.pwDraft }) });
      this.busy = false;
      if (!response.ok) {
        this.loginError = this.errorText(response, 'login.error');
        return;
      }
      sessionStorage.removeItem('admin_pw');
      sessionStorage.setItem('ge_admin_token', response.body.token);
      this.pwDraft = '';
      this.authed = true;
      await this.loadState();
    },
    async lock() {
      await this.api('/api/admin/logout', { method: 'POST', body: '{}' }, true);
      sessionStorage.removeItem('ge_admin_token');
      sessionStorage.removeItem('admin_pw');
      this.authed = false;
      this.participants = [];
      this.clearAdminError();
      this.securityNotice = '';
    },
    async loadState() {
      const response = await this.api('/api/admin/state', { method: 'GET' }, true);
      if (!response.ok) return;
      this.cfg = response.body.config;
      this.savedCfg = { ...response.body.config };
      this.participants = response.body.participants;
      this.locked = !!response.body.config.is_locked;
      if (response.body.config.event_title) document.title = response.body.config.event_title;
    },
    async saveConfig() {
      this.busy = true;
      this.clearAdminError();
      const numeric = ['adult_draws_adult', 'adult_draws_child', 'child_draws_adult', 'child_draws_child'];
      const body = { event_title: this.cfg.event_title, budget_note: this.cfg.budget_note };
      for (const key of numeric) body[key] = Math.max(0, Math.min(this.limits.max_quota, Number(this.cfg[key]) || 0));
      const response = await this.api('/api/admin/config', { method: 'PUT', body: JSON.stringify(body) }, true);
      this.busy = false;
      if (response.ok) this.toast(this.t('rules.saved'));
      else this.showAdminError(response);
      await this.loadState();
    },
    async addParticipant() {
      if (!this.draftReady) return;
      this.busy = true;
      this.clearAdminError();
      const response = await this.api('/api/admin/participants', { method: 'POST', body: JSON.stringify(this.draft) }, true);
      this.busy = false;
      if (!response.ok) { this.showAdminError(response); return; }
      this.draft = { name: '', role: this.draft.role, family_group: this.draft.family_group, wishlist: '' };
      await this.loadState();
      const field = document.getElementById('p-name');
      if (field) field.focus();
    },
    async removeParticipant(person) {
      if (!window.confirm(this.t('roster.confirmDelete', { name: person.name }))) return;
      this.busy = true;
      const response = await this.api(`/api/admin/participants/${person.id}`, { method: 'DELETE' }, true);
      this.busy = false;
      if (!response.ok) this.showAdminError(response);
      else await this.loadState();
    },
    async writeClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_err) { /* fall through to the textarea trick */ }
      const helper = document.createElement('textarea');
      helper.value = text;
      helper.setAttribute('readonly', '');
      helper.style.position = 'fixed';
      helper.style.opacity = '0';
      document.body.appendChild(helper);
      helper.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch (_err) { copied = false; }
      helper.remove();
      return copied;
    },
    async copyLink(person) {
      const url = `${window.location.origin}/?t=${person.token}`;
      if (!(await this.writeClipboard(url))) { window.prompt(this.t('err.copy'), url); return; }
      this.copiedId = person.id;
      clearTimeout(this._copyTimer);
      this._copyTimer = setTimeout(() => { this.copiedId = null; }, 1800);
    },
    async copyAllLinks() {
      const lines = this.participants
        .map(p => `${p.name} (${this.t('role.' + p.role)}, ${p.family_group}) — ${window.location.origin}/?t=${p.token}`)
        .join('\n');
      if (!(await this.writeClipboard(lines))) { window.prompt(this.t('err.copy'), lines); return; }
      this.copiedAll = true;
      this.toast(this.t('roster.copied'));
      clearTimeout(this._copyAllTimer);
      this._copyAllTimer = setTimeout(() => { this.copiedAll = false; }, 2200);
    },
    async runDraw() {
      if (this.warnings.length) return;
      if (!window.confirm(this.t('draw.confirmGenerate', { gifts: this.totals.gifts }))) return;
      this.busy = true;
      this.clearAdminError();
      const response = await this.api('/api/admin/draw', { method: 'POST', body: '{}' }, true);
      this.busy = false;
      if (!response.ok) {
        this.showAdminError(response);
        if (response.status === 409) this.toast(this.t('draw.alreadyLocked'), 'warn');
        await this.loadState();
        return;
      }
      this.toast(this.t('draw.done'));
      await this.loadState();
    },
    async resetDraw() {
      if (!window.confirm(this.t('draw.confirmReset'))) return;
      this.busy = true;
      this.clearAdminError();
      const response = await this.api('/api/admin/reset', { method: 'POST', body: '{}' }, true);
      this.busy = false;
      if (!response.ok) { this.showAdminError(response); return; }
      this.toast(this.t('draw.resetDone'));
      await this.loadState();
    },

    /* ---------- participant ---------- */
    async loadDraw() {
      const response = await this.api(`/api/draw/${encodeURIComponent(this.token)}`, { method: 'GET' });
      if (!response.ok) {
        this.pError = true;
        this.toast(this.errorText(response, 'p.invalidSub'), 'error');
        return;
      }
      const wasPending = this.data.status === 'PENDING';
      this.data = response.body;
      this.participant = response.body.participant;
      this.wishlistDraft = response.body.participant.wishlist || '';
      this.savedWishlist = this.wishlistDraft;
      if (response.body.event_title) document.title = response.body.event_title;
      if (wasPending && response.body.status === 'READY') this.toast(this.t('p.readyTease'), 'info');
      if (response.body.status === 'PENDING') this.schedulePoll();
    },
    schedulePoll() {
      clearTimeout(this.poll);
      this.poll = setTimeout(() => { if (this.data.status === 'PENDING') this.loadDraw(); }, 25000);
    },
    async refreshParticipant() {
      this.busy = true;
      await this.loadDraw();
      this.busy = false;
    },
    reveal() {
      this.revealed = true;
      sessionStorage.setItem('ge_revealed_' + this.token, '1');
      this.burstOn = true;
      this.makeSnow(16, true);
      setTimeout(() => { this.burstOn = false; }, 2200);
    },
    async copyMyList() {
      const list = this.data.assignments.length
        ? this.data.assignments.map(a => `${a.name} (${this.t('role.' + a.role)})${a.wishlist ? ': ' + a.wishlist : ''}`).join('\n')
        : this.t('p.noGifts');
      if (!(await this.writeClipboard(list))) return;
      this.copiedList = true;
      setTimeout(() => { this.copiedList = false; }, 1800);
    },
    queueWishlistSave() {
      clearTimeout(this._saveTimer);
      if (!this.wishlistDirty) return;
      this._saveTimer = setTimeout(() => this.saveWishlist(), 1200);
    },
    async saveWishlist() {
      clearTimeout(this._saveTimer);
      if (!this.wishlistDirty) return;
      this.busy = true;
      const response = await this.api(`/api/draw/${encodeURIComponent(this.token)}/wishlist`,
        { method: 'PUT', body: JSON.stringify({ wishlist: this.wishlistDraft }) });
      this.busy = false;
      if (!response.ok) { this.toast(this.errorText(response, 'err.unknown'), 'error'); return; }
      this.savedWishlist = this.wishlistDraft;
      this.savedAt = new Date().toISOString();
      if (this.data.participant) this.data.participant.wishlist = this.wishlistDraft;
      this.wishlistSaved = true;
    },

    /* ---------- ambience ---------- */
    makeSnow(count = 26, fast = false) {
      const host = document.getElementById('snow');
      if (!host) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const svgNS = 'http://www.w3.org/2000/svg';
      const palette = ['rgba(47,107,82,.30)', 'rgba(20,60,46,.16)', 'rgba(199,154,59,.55)', 'rgba(120,140,152,.30)'];
      for (let i = 0; i < count; i++) {
        const size = 8 + Math.random() * 18;
        const flake = document.createElementNS(svgNS, 'svg');
        flake.setAttribute('viewBox', '0 0 100 100');
        const use = document.createElementNS(svgNS, 'use');
        use.setAttribute('href', '#i-flake');
        flake.appendChild(use);
        flake.style.left = (Math.random() * 100) + 'vw';
        flake.style.width = size + 'px';
        flake.style.height = size + 'px';
        flake.style.opacity = (0.55 + Math.random() * 0.45).toFixed(2);
        const fall = fast ? 5 + Math.random() * 4 : 15 + Math.random() * 14;
        flake.style.animationDuration = `${fall}s, ${5 + Math.random() * 6}s`;
        flake.style.animationDelay = `${-Math.random() * fall}s, ${-Math.random() * 6}s`;
        flake.style.color = palette[Math.floor(Math.random() * palette.length)];
        host.appendChild(flake);
        flake.addEventListener('animationiteration', () => {
          if (fast) { flake.remove(); return; }
          flake.style.left = (Math.random() * 100) + 'vw';
        });
      }
    },
  };
}
</script>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.11.1/dist/cdn.min.js"></script>

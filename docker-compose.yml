services:
  gift-exchange:
    build: .
    image: gift-exchange:latest
    container_name: gift-exchange
    ports:
      - "8085:8000"
    volumes:
      - ./data:/app/data
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_PATH: /app/data/exchange.db
      # Leave SESSION_SECRET empty to derive it from ADMIN_PASSWORD + DB_PATH (PBKDF2).
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Where the organizer console lives. "/" is the family's page (landing card + their own
      # link); the console is not linked from it. Read at startup, so a change needs a recreate.
      ADMIN_PATH: ${ADMIN_PATH:-/admin}
      # Set to 1 only when a reverse proxy (Traefik/nginx) terminates TLS in front:
      # it is what makes X-Forwarded-For trusted for rate limiting and logs.
      TRUST_PROXY: ${TRUST_PROXY:-0}
    restart: unless-stopped

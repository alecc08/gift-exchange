<!doctype html>
<!--
  Source for static/icon-512.png and static/apple-touch-icon.png (add-to-home-screen icons).
  Rebuild:  python3 tools/build_share_art.py

  Square, one shape, high contrast: at 60 px on a phone home screen a snowflake is still readable
  and a gift box is not. Same palette as the app; no text, because icon text becomes mush.
-->
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(360px 360px at 50% 42%, rgba(199,154,59,.26), rgba(199,154,59,0) 66%),
      linear-gradient(135deg, #0a1f18 0%, #0e2b21 48%, #1f5340 100%);
  }
  svg { position: absolute; inset: 0; width: 512px; height: 512px; }
</style>
</head>
<body>
<svg viewBox="0 0 512 512" aria-hidden="true">
  <defs>
    <g id="arm" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round">
      <path d="M256 256V78"/><path d="M256 118l-46-40"/><path d="M256 118l46-40"/>
      <path d="M256 176l-62-52"/><path d="M256 176l62-52"/>
    </g>
  </defs>
  <g color="#e6c98a">
    <use href="#arm"/><use href="#arm" transform="rotate(60 256 256)"/><use href="#arm" transform="rotate(120 256 256)"/>
    <use href="#arm" transform="rotate(180 256 256)"/><use href="#arm" transform="rotate(240 256 256)"/>
    <use href="#arm" transform="rotate(300 256 256)"/>
    <circle cx="256" cy="256" r="20" fill="currentColor"/>
  </g>
  <g color="#c0392f" opacity=".9"><circle cx="256" cy="256" r="7"/></g>
</svg>
</body>
</html>
